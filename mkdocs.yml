site_name: Substrate Project
site_description: A test python substrate app with Copier
site_url: https://ruairiodonohoe.github.io/substrate-project.git
repo_url: https://github.com/ruairiodonohoe/substrate-project.git
repo_name: ruairiodonohoe/substrate-project.git

strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material

nav:
  - Home: index.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
